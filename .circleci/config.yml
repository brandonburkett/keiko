version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.18.0
    steps:
      - checkout
      # cache node_modules keyed on the lock file
      - restore_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Install node modules
          command: npm ci
      - save_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      - run:
          name: Type check
          command: npm run type-check
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm run test:unit
      - run:
          name: Build
          command: npm run build-only
      # AWS is only needed to deploy, install it after the checks so a failing
      # build does not pay for the download
      - run:
          name: Install AWS CLI v2
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip
              sudo ./aws/install --update
              aws --version
            else
              echo "Not master, skipping AWS CLI install"
            fi
      - run:
          name: Deploy to S3 + CloudFront invalidation
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              echo "Deploying to production"
              ./.circleci/production.sh
            else
              echo "Not master, skipping deploy"
            fi
workflows:
  build:
    jobs:
      - build
