version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:24.18.0
    steps:
      - checkout
      # Install AWS CLI v2 (official installer; the node image doesn't ship aws).
      # This unzips into ./aws in the project, eslint.config.mjs ignores it.
      - run:
          name: Install AWS CLI v2
          command: |
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --update
            aws --version
      # cache node_modules keyed on the lock file
      - restore_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Install node modules
          command: npm ci
      - save_cache:
          key: npm-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      # type check (vue-tsc)
      - run:
          name: Type check
          command: npm run type-check
      - run:
          name: Lint
          command: npm run lint
      # unit tests (Vitest)
      - run:
          name: Run tests
          command: npm run test:unit
      # type check already ran above, so build without it
      - run:
          name: Build
          command: npm run build-only
      - run:
          name: Deploy to S3 + CloudFront invalidation
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              echo "Deploying to production"
              ./.circleci/production.sh
            elif [[ ${CIRCLE_BRANCH} =~ int\/.* ]]; then
              echo "No deployment for staging"
              # ./.circleci/staging.sh
            elif [[ ${CIRCLE_BRANCH} =~ hot\/.* ]]; then
              echo "No deployment for hot fixes"
              # ./.circleci/staging.sh
            fi
workflows:
  build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - master
